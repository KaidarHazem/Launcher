[env:headless-esp32-4mb]
board = esp32
board_build.partitions = support_files/custom_4Mb_noOta.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"CyberOS Launcher"'

	# إعدادات الشاشة ST7789 240x240
	-DUSE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_CS=27
	-DTFT_DC=26
	-DTFT_RST=25
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_MISO=-1
	-DTFT_BL=-1
	-DUSE_HSPI_PORT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_MODE=3
	-DTFT_RGB_ORDER=TFT_RGB

	# إعدادات كارت الميموري SD (VSPI)
	-DSDCARD_CS=5
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23

	# أزرار التحكم
	-DUP_BTN=32
	-DDW_BTN=33
	-DSEL_BTN=12
	-DESC_BTN=21

	-DLED=2
	-DLED_ON=HIGH

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
